<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Color Escape Slide Out</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; background: #000; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
    <script src="Build/BuildsWeb.loader.js"></script>
    <script>
      // Portrait game: keep a 9:16 canvas centered. Taller screens (phones) use the full area.
      var ASPECT = 9 / 16;
      var canvas = document.querySelector('#unity-canvas');
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var cw = w, ch = h;
        if (w / h > ASPECT) { cw = Math.floor(h * ASPECT); }
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/BuildsWeb.data.unityweb",
        frameworkUrl: "Build/BuildsWeb.framework.js.unityweb",
        codeUrl: "Build/BuildsWeb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "indie",
        productName: "Color Escape Slide Out",
        productVersion: "2.1",
      }).then(function (u) { fit(); }).catch(function (message) { console.error(message); });
    </script>
  </body>
</html>
